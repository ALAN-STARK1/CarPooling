server:
  port: 8081
spring:
  application:
    name: CarPooling
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/carpooling?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: "123456"
  data:
    redis:
      host: localhost
      port: 6379
